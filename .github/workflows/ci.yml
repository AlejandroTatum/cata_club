name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base a proposito: con `branches: [main]` los PRs
  # apilados (los que apuntan a la rama padre en vez de a main) no
  # disparaban CI y quedaban sin validar hasta que el padre mergeaba.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  guard-secretos:
    name: "Guard: sin .env reales trackeados"
    runs-on: ubuntu-latest
    # Corre como PRIMER job a propósito: un `.env` committeado queda en el
    # historial para siempre aunque se borre después, así que el candado
    # debe disparar lo antes posible y sin depender de que el resto del
    # workflow arranque Postgres o instale toolchains. El check es sobre el
    # árbol del PR (`git ls-files`): detecta también un `git add -f` que
    # bypassee el .gitignore.
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any real .env is tracked
        # Globs de `case`, no regex: el primer arm que matchea gana. Las
        # plantillas versionadas terminan en `.example` (`.env.example`,
        # `frontend/.env.local.example`, `.env.production.example`) y son el
        # único caso permitido; cualquier otra ruta con basename `.env` o
        # `.env.*` (`.env.local`, `.env.production`, un `.env` anidado)
        # tira el job abajo.
        run: |
          IFS=$'\n' read -r -d '' -a tracked < <(git ls-files -z | tr '\0' '\n') || true
          bad=()
          for f in "${tracked[@]}"; do
            case "$f" in
              *.example) ;;                     # plantillas, OK
              .env|.env.*|*/.env|*/.env.*) bad+=("$f") ;;
            esac
          done
          if [ ${#bad[@]} -gt 0 ]; then
            printf '::error::Archivos .env reales committeados: %s\n' "${bad[*]}"
            exit 1
          fi

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres real (REQ-TEST-2, sdd/production-readiness): la suite ya no
    # corre sobre SQLite en memoria, sino contra un servicio Postgres 16
    # equivalente al `db-test` de docker-compose.yml (mismo contrato de un
    # solo env var, `TEST_DATABASE_URL` — ver decisión de diseño 1.1). Esto
    # ejercita migraciones Alembic reales, FKs, y tipos nativos de Postgres
    # en cada PR, no solo en el job separado `migraciones-desde-cero`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cataclub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d cataclub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        # Pineada al SHA del commit en vez del tag movil: un tag puede
        # reapuntarse a otro codigo sin que el workflow cambie.
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        # --no-build: instala solo wheels, sin ejecutar setup scripts de
        # sdists. Verificado que los 78 paquetes del lock resuelven a wheels
        # (incluye import-linter y grimp, agregados en #832).
        run: uv sync --frozen --no-build

      - name: Lint
        # Sin este gate el backend acumulo 23 errores de ruff sin que nadie
        # los viera: el workflow solo linteaba el frontend. La config vive en
        # backend/pyproject.toml ([tool.ruff]).
        run: uv run --frozen --no-build ruff check .

      - name: Lint imports
        # El contrato de capas vive en backend/pyproject.toml
        # ([tool.importlinter]): sin este paso corriendo en CI, una nueva
        # violacion de la direccion de dependencias no pone nada en rojo
        # (issue #832).
        run: uv run --frozen --no-build lint-imports

      - name: Audit de vulnerabilidades (pip-audit)
        # `uv` no tiene subcomando de audit propio; pip-audit vive en
        # [dependency-groups.dev] igual que ruff e import-linter y audita el
        # lock resuelto. Sin `continue-on-error`: una `high`/`critical` nueva
        # tiene que poner el job en rojo, no quedar como alarma desenchufada
        # (issue #1063).
        run: uv run --frozen --no-build pip-audit

      - name: Run tests
        # Solo TEST_DATABASE_URL. `AMBIENTE` y `JWT_SECRET_KEY` los pone
        # `backend/tests/conftest.py` con `setdefault`, que es el único lugar
        # donde vive el contrato de entorno de la suite (issue #101). NO se
        # declaran acá a propósito: si estuvieran, CI pasaría igual aunque el
        # default del conftest se rompiera, y volveríamos a tener un gate que
        # solo funciona en CI. Que este paso corra sin ellas ES la prueba.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://usuario:password@localhost:5432/cataclub_test
        run: uv run --frozen --no-build pytest tests/ -v --cov=app --cov-report=term-missing

      - name: Install age (cifrado de backups)
        # `tests/test_backup_controls.py` verifica que el dump cifrado no
        # contenga texto plano y que el restore haga round-trip. Sin `age` esos
        # tests se SALTEAN, y un candado que se saltea en CI no es un candado:
        # el agujero que cierran (padrón médico de menores en claro sobre el
        # disco del droplet) volvería sin que el pipeline dijera nada.
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Root-level tests (tests/ del repo, no backend/tests/)
        # Los tests de `tests/` (raíz del repo) viven FUERA de `backend/tests/`
        # a propósito: no necesitan Postgres ni los fixtures de
        # `backend/tests/conftest.py` (ver el docstring de cada archivo). El
        # paso de arriba (`pytest tests/` con working-directory: backend, o
        # sea `backend/tests`) nunca los ve, y la versión anterior de este
        # paso enganchaba a mano SOLO `test_docker_compose_config.py`: una
        # lista manual que se pudre — `test_alembic_cabeza_unica.py` y
        # `test_qa_verify_build_sha.py` existieron durante meses sin que CI
        # los corriera jamás (issue #552, misma clase de bug que este
        # comentario ya documentaba para el compose). Por eso ahora se corre
        # el DIRECTORIO entero: un test raíz nuevo queda cubierto solo.
        # Se engancha aquí y no en un job propio porque este job ya tiene el
        # venv del backend con pytest (y alembic, que usa el test de cabeza
        # única), y Docker Compose viene preinstalado en ubuntu-latest.
        # Sin bloque `env:`: la suite es autocontenida — el test de compose
        # inyecta sus propios centinelas (JWT_SECRET_KEY, CORS_ORIGENES, ...)
        # en el subproceso de `docker compose config`, y el resto mockea o
        # stubea sus fronteras (git, red, crontab, docker). Que este paso
        # corra sin variables ES la prueba de que siguen autocontenidos.
        run: uv run --frozen --no-build pytest ../tests/ -v

  migraciones-desde-cero:
    name: Migraciones desde DB vacia (empty -> head)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Job dedicado, separado del job `backend` (que desde
    # sdd/production-readiness también migra Postgres real antes de correr
    # la suite -- ver `esquema_migrado` en tests/conftest.py). Se mantiene
    # como señal independiente de "la cadena de migraciones aplica de punta
    # a punta sobre una DB vacía", desacoplada de fallas de los tests de
    # aplicación (decisión de diseño 1.2). Esto ya dejó pasar un bug real:
    # `c4d5e6f7a8b9` referenciaba una constraint con el nombre viejo que no
    # existe contra una DB creada desde cero (ver el comentario en ese
    # archivo de migración).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usuario
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cataclub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usuario -d cataclub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        # Pineada al SHA del commit en vez del tag movil: un tag puede
        # reapuntarse a otro codigo sin que el workflow cambie.
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Install dependencies
        # --no-build: instala solo wheels, sin ejecutar setup scripts de
        # sdists. Verificado que los 72 paquetes del lock resuelven a wheels.
        run: uv sync --frozen --no-build

      - name: Run alembic upgrade head against an empty database
        env:
          AMBIENTE: test
          DATABASE_URL: postgresql+psycopg://usuario:password@localhost:5432/cataclub_ci
          JWT_SECRET_KEY: "clave_super_secreta_y_segura_de_mas_de_32_caracteres_para_los_tests"
        run: uv run --frozen --no-build alembic upgrade head

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Sin `version:` explícito: la acción lee el campo `packageManager`
        # de frontend/package.json (pnpm@10.33.2), que queda como única
        # fuente de verdad. Antes CI fijaba pnpm 9 mientras el proyecto
        # declaraba pnpm 10 -- dos versiones distintas resolviendo el mismo
        # lockfile. `package_json_file` es necesario porque el default de la
        # acción es el package.json de la RAÍZ del repo, que no existe.
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests + coverage
        # Una sola corrida de vitest, no dos. Antes había un paso `pnpm test`
        # (`vitest run`) justo antes de este: ejecutaba EXACTAMENTE la misma
        # suite, y este es superconjunto estricto — corre los mismos tests y
        # además aplica los thresholds. El primer paso no aportaba ninguna
        # señal que este no diera, y costaba la suite entera de nuevo.
        #
        # Sin `continue-on-error`: con los thresholds de vitest.config.ts este
        # paso es un gate real. Antes la cobertura se medía pero no podía
        # fallar el build — alarma instalada pero desenchufada.
        run: pnpm run test:coverage

      - name: Build
        run: pnpm build

      - name: Prepare standalone
        run: cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test

      - name: Upload Playwright Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-images:
    name: Imagenes Docker (build, arranque real y publicacion en GHCR)
    runs-on: ubuntu-latest
    # `needs` sobre el job COMPLETO, no solo sobre los pasos de publicación:
    # sin esto, en un push a main este job publicaba `:sha` y `:latest` a
    # GHCR aunque backend/frontend/migraciones estuvieran FALLANDO en ese
    # mismo run (issue #552) — el droplet arrastra `:latest` con `docker
    # compose pull`, así que una suite roja terminaba en producción. El
    # costo asumido: en PRs (donde nada se publica) el build de imágenes
    # ahora espera a que los otros jobs terminen en vez de correr en
    # paralelo. Se prefiere igual el `needs` simple sobre el job entero
    # antes que condicionales por-paso más finos pero frágiles: la
    # verificación de arranque sigue corriendo en todos los PRs, solo que
    # después de los gates baratos. `guard-secretos` también entra: jamás
    # construir ni publicar imágenes de un árbol que committeó un `.env`.
    needs: [guard-secretos, backend, frontend, migraciones-desde-cero]
    # Hasta este job, NINGUNA parte del pipeline construía un contenedor ni
    # levantaba la pila: las imágenes que corre producción no las validaba
    # nadie. Ese hueco fue el que dejó pasar un contenedor de frontend que
    # directamente no podía arrancar (PR #170, `HOSTNAME=0.0.0.0` en
    # frontend/Dockerfile) -- el bug era invisible para los tests unitarios
    # porque solo existe en la imagen construida.
    #
    # Este job ejercita la ruta de PRODUCCIÓN, no la de desarrollo:
    # `docker-compose.override.yml` es quien aporta `build:` y los puertos
    # publicados, y Compose lo auto-carga con `docker compose` a secas -- por
    # eso aquí SIEMPRE se pasan `-f docker-compose.yml -f
    # docker-compose.prod.yml` explícitos y el override nunca entra. Como el
    # overlay de producción no tiene `build:`, las dos imágenes se construyen
    # aparte y se etiquetan exactamente con el nombre que la base espera
    # (`ghcr.io/alejandrotatum/cata_club-{backend,frontend}:${IMAGE_TAG}`);
    # Compose las consume por referencia. Así se prueba el mismo apilado que
    # corre en el droplet, incluido `AMBIENTE: production` (que, entre otras
    # cosas, oculta /docs -- por eso el healthcheck del backend apunta a
    # /health y no a /docs).
    permissions:
      # Alcance mínimo y acotado a ESTE job (el workflow no declara
      # `permissions` global, así que el resto de jobs conserva el default):
      # leer el código para el checkout y escribir paquetes para el push a
      # GHCR. Se autentica con el GITHUB_TOKEN integrado -- no hace falta
      # ningún secreto nuevo.
      contents: read
      packages: write
    env:
      # Tag inmutable = SHA del commit. Es el que consume la pila durante la
      # verificación, así que lo que se arranca y lo que se publica es
      # literalmente la misma imagen.
      IMAGE_TAG: ${{ github.sha }}
      IMAGEN_BACKEND: ghcr.io/alejandrotatum/cata_club-backend
      IMAGEN_FRONTEND: ghcr.io/alejandrotatum/cata_club-frontend
      # El overlay de produccion fija `AMBIENTE: production`, y con eso se
      # activa `_exigir_config_de_produccion` (configuracion.py), que rechaza
      # los defaults de desarrollo del compose: `SMTP_HOST=mailpit` (el correo
      # se envia con exito y muere en el catcher) y `FRONTEND_URL=localhost`
      # (el enlace de recuperacion viaja en el correo y no abre en el
      # dispositivo del usuario). Sin estas dos variables el backend NO
      # arranca -- y no debe: esa es justamente la falla que el validador
      # existe para provocar.
      #
      # Por eso este bloque `env:` vale como checklist ejecutable de lo minimo
      # que un despliegue real tiene que definir: si mañana el validador exige
      # una variable mas, este job se cae acá, en CI, y no en el servidor.
      #
      # Los valores son de mentira a proposito. `.invalid` esta reservado por
      # RFC 2606 y no resuelve nunca, asi que ni siquiera por accidente se
      # puede enviar correo desde CI. Solo tienen que pasar el validador: un
      # host SMTP que no sea un catcher, y una URL absoluta https sin loopback.
      SMTP_HOST: smtp.ci.invalid
      FRONTEND_URL: https://cataclub.ci.invalid
      # PR compose-slice (sdd/production-config-contract): el overlay de
      # producción ahora EXIGE esta variable (`${CORS_ORIGENES:?...}`) -- sin
      # ella este job se cae en `docker compose config`, no en el servidor.
      CORS_ORIGENES: https://cataclub.ci.invalid
      # PR del ingress TLS (feat/ingress-tls-caddy): el overlay de producción
      # suma el servicio `caddy` y EXIGE estas dos (`${DOMINIO:?...}` y
      # `${ACME_EMAIL:?...}`) -- sin ellas este job se cae al renderizar el
      # compose, no en el servidor. Mismo criterio que arriba: `.invalid` no
      # resuelve nunca, así que Let's Encrypt jamás emite un certificado para
      # este dominio ni manda un aviso a esta casilla desde CI.
      DOMINIO: cataclub.ci.invalid
      ACME_EMAIL: ci@cataclub.ci.invalid
      # PR registro de Settings (sdd/production-config-contract): estas 3
      # credenciales ahora son criticas para produccion
      # (_CAMPOS_PRODUCCION_CRITICOS en configuracion.py) -- sin ellas el
      # backend no arranca. Valores de mentira: alcanza con que pasen el
      # validador, ninguna subida a Cloudinary ocurre en este job.
      # Se derivan del run_id en vez de escribirse como literales: deja a la
      # vista que son descartables y no un secreto que alguien deba rotar.
      CLOUDINARY_CLOUD_NAME: cataclub-ci-invalid
      CLOUDINARY_API_KEY: ci-${{ github.run_id }}
      CLOUDINARY_API_SECRET: ci-${{ github.run_id }}
      # Mismo PR: `_exigir_config_de_produccion` ahora rechaza tambien las
      # credenciales de Postgres por defecto de `docker-compose.yml`
      # (`usuario`/`password`), sin importar el host -- por eso hacia falta
      # este chequeo agnostico al host y no solo la comparacion de URL
      # completa contra `_DATABASE_URL_DE_EJEMPLO`. Sin fijar estas tres
      # variables, el backend de este job se cae al arrancar.
      POSTGRES_USER: cataclub_ci
      POSTGRES_PASSWORD: ci-${{ github.run_id }}
      POSTGRES_DB: cataclub_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Accion de terceros: pineada al SHA del commit en vez del tag movil,
        # igual que astral-sh/setup-uv en los jobs de arriba.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Generate a throwaway JWT_SECRET_KEY
        # docker-compose.yml declara `JWT_SECRET_KEY: "${JWT_SECRET_KEY:?...}"`,
        # así que CUALQUIER comando de Compose (incluido `ps`) falla sin la
        # variable. Se genera al vuelo y se descarta con el runner: jamás se
        # hardcodea un secreto real ni se necesita uno de repositorio.
        run: |
          clave=$(openssl rand -hex 32)
          echo "::add-mask::$clave"
          echo "JWT_SECRET_KEY=$clave" >> "$GITHUB_ENV"

      - name: Build backend image
        # `load: true` deja la imagen en el daemon local para que Compose la
        # consuma por referencia y, si toca publicar, se empuje EXACTAMENTE el
        # mismo artefacto que se acaba de verificar (nada se reconstruye).
        # `provenance: false` porque los attestations no son compatibles con
        # `load`. Cache de GitHub Actions (type=gha) con scope propio por
        # imagen para que las dos no se pisen entre sí.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          load: true
          provenance: false
          tags: ${{ env.IMAGEN_BACKEND }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        # Las NEXT_PUBLIC_* se inlinean en el bundle en tiempo de build (ver
        # frontend/Dockerfile), así que van como build args, no como env de
        # runtime. Valores elegidos para CI:
        #   NEXT_PUBLIC_API_URL: el mismo del override de desarrollo. Es
        #     inerte en esta app -- el navegador siempre pega same-origin a
        #     los Route Handlers del BFF (src/services/api.ts, `getBaseUrl()`
        #     devuelve ""), y el servidor de Next habla con FastAPI por
        #     `BACKEND_API_URL`, que es env de RUNTIME y lo inyecta Compose.
        #   NEXT_PUBLIC_APP_NAME: mismo valor que en desarrollo; solo alimenta
        #     el <title> (src/app/layout.tsx).
        #   NEXT_PUBLIC_USE_MOCKS: el que SÍ importa. `api.ts` lo lee con
        #     `!== "false"`, o sea que si queda sin definir la imagen sale con
        #     los mocks ENCENDIDOS. Se fija explícito a "false".
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          load: true
          provenance: false
          tags: ${{ env.IMAGEN_FRONTEND }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_APP_NAME=Cata Club Admin
            NEXT_PUBLIC_USE_MOCKS=false
            BUILD_SHA=${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Boot the production stack
        # Los `-f` se escriben completos en cada paso a propósito, en vez de
        # esconderlos en una variable: una variable que contiene un comando
        # solo funciona por word splitting del shell, y basta con que alguien
        # la entrecomille (o cambie el `shell:`) para que el override de
        # desarrollo vuelva a colarse en silencio. Acá eso no puede pasar.
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - name: Wait until every healthchecked service is healthy
        # Nada de `sleep`: se sondea `docker compose ps` hasta que TODO
        # servicio esté `running` y, si declara healthcheck, `healthy`. La
        # lista no se hardcodea -- sale del propio `ps`, así que un servicio
        # nuevo queda cubierto solo. Timeout acotado (7 min: el `start_period`
        # más largo es el de celery-worker/beat, 90s) y fallo ruidoso, nunca
        # un cuelgue hasta el timeout del runner.
        #
        # Tres detalles que antes hacían esta guardia CIEGA a un contenedor en
        # crash-loop (backend, celery-worker y celery-beat llevan
        # `restart: unless-stopped`, así que reinician para siempre):
        #
        #   1. `ps` SIN `-a` omite los contenedores que no están corriendo: uno
        #      `exited` desaparece del listado y por lo tanto del conjunto de
        #      pendientes. Con `-a` siempre está.
        #   2. Un contenedor que reinicia reporta `Health` VACÍO durante casi
        #      todo el ciclo -- el filtro anterior (`select(.Health != "")`)
        #      lo leía como "este servicio no declara salud, ignoralo" y daba
        #      la pila por buena. Ahora el criterio es primero `.State`: si no
        #      está `running`, está pendiente, tenga salud o no. Un servicio
        #      que genuinamente no reporta salud y está `running` sigue sin
        #      exigirla, igual que antes. Ojo: no alcanza con mirar este
        #      compose para saber quién reporta salud -- `mailpit` no declara
        #      `healthcheck:` acá y aun así reporta `healthy`, porque la imagen
        #      `axllent/mailpit` trae su propio HEALTHCHECK en su Dockerfile.
        #   3. `restarting`/`exited`/`dead`/`paused` no son "todavía no": son
        #      falla. Se exige que el síntoma persista 3 sondeos seguidos
        #      (~20s) para no confundirlo con el parpadeo exited->restarting
        #      de un arranque normal, y entonces se corta al instante en vez de
        #      quemar los 420s completos.
        #
        # La línea de estado reporta `.State` cuando no hay salud (p.ej.
        # `celery-worker=restarting`), para que el fallo sea diagnosticable
        # desde el log sin abrir los diagnósticos.
        run: |
          limite=$((SECONDS + 420))
          sondeos_rotos=0
          while true; do
            instantanea=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -a --format json)
            estado=$(printf '%s\n' "$instantanea" \
              | jq -rs '[.[] | .Service + "=" + (if .Health == "" then .State else .Health end)] | join(" ")')
            rotos=$(printf '%s\n' "$instantanea" \
              | jq -rs '[.[] | select(.State == "restarting" or .State == "exited" or .State == "dead" or .State == "paused") | .Service + "=" + .State] | join(" ")')
            pendientes=$(printf '%s\n' "$instantanea" \
              | jq -rs '[.[] | select(.State != "running" or (.Health != "" and .Health != "healthy")) | .Service] | join(" ")')
            if [ -n "$rotos" ]; then
              sondeos_rotos=$((sondeos_rotos + 1))
              if [ "$sondeos_rotos" -ge 3 ]; then
                echo "::error::Servicios caidos o en reinicio permanente: $rotos (estado: $estado)"
                exit 1
              fi
            else
              sondeos_rotos=0
            fi
            if [ -z "$pendientes" ]; then
              echo "Todos los servicios estan running y los que declaran salud estan healthy: $estado"
              break
            fi
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::Timeout esperando healthy. Estado final: $estado"
              exit 1
            fi
            echo "esperando a: $pendientes (estado: $estado)"
            sleep 10
          done

      - name: Verify the frontend serves the built revision
        # Cierre del issue #927: el build-arg `BUILD_SHA` (paso de arriba) se
        # puede borrar en un futuro PR sin que nada se rompa a simple vista --
        # es solo un argumento de build que Docker ignora si no está. Este
        # paso es el candado en runtime: le pregunta a la imagen YA
        # levantada, con `docker compose exec`, y no puede mentir porque lee
        # el mismo `/api/health` que sirve en producción. La imagen final es
        # `node:20-alpine` sin curl (ver el healthcheck del frontend en
        # docker-compose.yml), así que se usa el mismo idioma `node -e` que
        # ese healthcheck ya usa.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T -e ESPERADO="$IMAGE_TAG" frontend node -e '
            const http = require("http");
            const esperado = process.env.ESPERADO;
            http.get("http://127.0.0.1:3000/api/health", (r) => {
              let cuerpo = "";
              r.on("data", (d) => { cuerpo += d; });
              r.on("end", () => {
                let sha;
                try {
                  sha = JSON.parse(cuerpo).sha;
                } catch (e) {
                  console.error("no se pudo parsear /api/health:", e.message);
                  process.exit(1);
                }
                console.log(`servido=${sha} esperado=${esperado}`);
                if (!sha || sha === "unknown" || sha !== esperado) {
                  process.exit(1);
                }
              });
            }).on("error", (e) => {
              console.error("no se pudo consultar /api/health:", e.message);
              process.exit(1);
            });
          '

      - name: Dump diagnostics (on failure)
        # Sin esto, un fallo de arranque en CI es una caja negra: `ps` da el
        # estado de salud de cada servicio y los logs, la razón real.
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=200

      - name: Log in to GHCR
        # Solo en `push` a main: un PR (y en especial uno desde un fork) NUNCA
        # debe poder publicar imágenes. Y va DESPUÉS de la verificación de
        # arranque, así que una imagen que no levanta jamás llega al registro.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Dos tags por imagen, a propósito:
        #   - <sha del commit>: inmutable. Es a lo que se debe fijar un deploy
        #     para poder reproducirlo o hacer rollback exacto; nunca cambia de
        #     contenido.
        #   - latest: movil. Es el default de `${IMAGE_TAG:-latest}` en
        #     docker-compose.yml, o sea lo que arrastra un `docker compose
        #     pull` sin variables en el droplet.
        # Se publica el binario ya cargado y verificado (`docker tag` + `push`),
        # no una reconstrucción: lo que se probó es bit a bit lo que se sube.
        run: |
          for imagen in "$IMAGEN_BACKEND" "$IMAGEN_FRONTEND"; do
            docker tag "$imagen:$IMAGE_TAG" "$imagen:latest"
            docker push "$imagen:$IMAGE_TAG"
            docker push "$imagen:latest"
          done

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v --remove-orphans
