# SonarQube Cloud — configuración del análisis automático.
#
# Este es el archivo que el análisis automático lee. NO es
# `sonar-project.properties`: la documentación es explícita en que "SonarQube
# Cloud will ignore the parameters in your sonar-project.properties file"
# cuando el análisis es automático. Poner las exclusiones en el archivo
# equivocado no da error, simplemente no hace nada.
#
# ── Por qué `docs/` no entra en el análisis
#
# `docs/` no es código que se despliegue. Son informes, registros de decisión,
# capturas de auditoría y los prototipos HTML que el producto ya reemplazó.
# Analizarlo como fuente de producción es lo que venía dejando la compuerta en
# rojo en cada PR que tocaba documentación: el #278 movió 446 archivos bajo
# `docs/` y falló igual que este.
#
# El disparador acá es medible. Mover doce mockups archivados a
# `docs/archive/prototypes/mockups-v1/` hizo que Sonar los leyera como código
# NUEVO, y doce páginas HTML casi idénticas entre sí puntúan 63.2% de
# duplicación contra una compuerta del 3%. Sus avisos de contraste son reales y
# también son irrelevantes: esos archivos no se sirven a nadie. Las reglas de
# contraste de las pantallas VIVAS las cubren `color-contrast.test.ts`,
# `ink-ramp-usage.test.ts` y el barrido de QA, que miden el producto corriendo.
#
# El plan gratuito de la organización permite 50k LOC, mientras este repositorio
# contiene unas 168k entre producción, tests, migraciones y tooling. El análisis
# se concentra en el runtime del backend, la superficie más sensible. El frontend
# sigue cubierto por TypeScript, ESLint, Vitest y Playwright en CI.
#
# Las ~24.5k líneas crudas del conjunto incluido son una cota superior
# determinista del conteo de Sonar, que no suma comentarios ni líneas en
# blanco. `tests/test_sonarcloud_config.py` verifica ese presupuesto y la
# cobertura del runtime: si aparece un entrypoint nuevo fuera de
# `backend/app/`, el candado lo exige antes de que el análisis lo ignore.
sonar.inclusions=backend/app/**/*.py,backend/main.py
