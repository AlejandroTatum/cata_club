# Overlay de DESARROLLO. `docker compose` lo carga automáticamente junto a
# `docker-compose.yml` cuando no se pasa ningún `-f` -- por eso el flujo
# local (`docker compose up`, `make dev-backend`, etc.) no cambia con esta
# PR. Acá viven las DOS cosas que la producción no puede tener nunca
# (decisión de diseño 4.1, sdd/production-readiness):
#
#   1. `build:` -- construir la imagen del frontend es justo lo que se
#      midió como causa de OOM en un droplet de 2GB.
#   2. Puertos publicados en el host -- en producción, Caddy es el único
#      punto de entrada (PR-14 continuación) y `db`/`redis` nunca deben ser
#      alcanzables desde fuera del droplet.
#
# Todos los puertos de acá se publican en `127.0.0.1` y no en `0.0.0.0`.
# Sin el prefijo, Docker los expone en TODAS las interfaces: en una laptop
# que se conecta a redes ajenas eso deja Postgres, Redis y la UI de mailpit
# (que no pide credenciales) alcanzables desde el resto de la red. Activar
# un firewall de host no alcanza: Docker escribe sus cadenas `nat`/`DOCKER`
# y esas se evalúan antes que INPUT, donde ufw pone sus reglas. El binding
# a loopback es lo único que cierra el puerto de verdad, y no cambia el
# flujo local -- `localhost:3000`, `localhost:5436` y `make test-backend`
# siguen funcionando igual.
#
# NUNCA se aplica junto con `docker-compose.prod.yml`. El overlay de
# producción se invoca explícito: `docker compose -f docker-compose.yml
# -f docker-compose.prod.yml <comando>`.
services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  # Postgres efímero de la suite del backend (perfil "test", ver
  # docker-compose.yml). El puerto vive acá y no en la base porque
  # `docker compose config` de producción renderiza también los servicios
  # con `profiles:` -- dejarlo en la base lo publicaba en el render de
  # producción aunque el contenedor nunca arranque ahí. `docker compose
  # --profile test up -d db-test` (sin `-f`) carga este override solo, así
  # que `make test-backend` sigue llegando a localhost:5436.
  db-test:
    ports:
      - "127.0.0.1:5436:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # Cazamoscas de correo para DESARROLLO. El servicio ENTERO vive acá, no
  # solo sus puertos: la UI web no tiene autenticación de ningún tipo, y
  # con él en la base el render de producción lo incluía igual -- los
  # overlays de Compose solo fusionan, jamás pueden remover una clave, así
  # que `docker-compose.prod.yml` no tenía forma de quitarlo (mismo
  # razonamiento que `build:` y los puertos publicados, arriba). Como
  # `SMTP_HOST: ${SMTP_HOST:-mailpit}`, un operador que no sobrescriba el
  # SMTP en producción manda el correo transaccional real (incluidos los
  # enlaces de recuperación de contraseña) a un buzón abierto a internet --
  # sacar el servicio de la base es lo único que lo garantiza.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "127.0.0.1:1025:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # UI web para ver correos capturados

  backend:
    build:
      context: ./backend
      # El resolver DNS embebido de la red bridge por defecto falla para
      # descargar paquetes (PyPI) en algunos setups aunque el host tenga
      # internet — se construye sobre la red del host para evitarlo. Solo
      # afecta al build, no al contenedor en ejecución.
      network: host
    ports:
      - "127.0.0.1:8000:8000"

  celery-worker:
    build:
      context: ./backend
      network: host

  celery-beat:
    build:
      context: ./backend
      network: host

  frontend:
    build:
      context: ./frontend
      # Mismo motivo que el build del backend: se construye sobre la red
      # del host para evitar el fallo del resolver DNS embebido.
      network: host
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_APP_NAME: Cata Club Admin
        NEXT_PUBLIC_USE_MOCKS: "false"
        BUILD_SHA: ${BUILD_SHA:-unknown}
    ports:
      - "127.0.0.1:3000:3000"
