[project]
name = "product-admin-backend"
version = "1.3.0"
description = "API Cata Club - Sistema Integral de Administración (UNL - Diseño de Software)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",  # passlib 1.7.4 no soporta la API de bcrypt>=4.1 (rompe el hashing en runtime)
    "python-multipart>=0.0.12",
    # --- Automatizaciones (Celery + Redis + Beat) ---
    "celery>=5.4.0",
    "redis>=5.1.0",
    # --- Generación de PDFs en memoria ---
    "reportlab>=4.2.0",
    # --- Almacenamiento de archivos en la nube ---
    "cloudinary>=1.41.0",
    # `urllib3` ya es transitiva de `cloudinary`; se declara explícita porque
    # `cloudinary_cliente.py` construye un `urllib3.util.Timeout` directamente
    # (ver `resiliencia.py`), así que el proyecto depende de su API, no solo
    # de que Cloudinary la arrastre.
    "urllib3>=2.0.0",
    # --- Rate limiting ---
    "slowapi>=0.1.9",
    # --- Chatbot de FAQ (MiMo vía gateway OpenAI-compatible OpenCode Zen) ---
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    # Linter. Vive en el lock, no en el PATH del desarrollador: CI corre
    # `uv sync --frozen`, así que un ruff global no estaría disponible ahí.
    "ruff>=0.15.12",
    "import-linter>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Piso apenas debajo de la cobertura real medida (91.23% el 2026-07-30):
# una caída notable rompe el build, el ruido de un punto no. Subirlo es una
# decisión visible en el diff, igual que el `select` de ruff.
fail_under = 90

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Set por defecto de ruff: E4 (imports, incluye E402), E7, E9 y F (pyflakes),
# mas C901 (complejidad ciclomatica, issue #832). Se deja explicito para que
# ampliarlo mas alla siga siendo una decision visible en el diff.
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
# Umbral 12: deja pasar todo el codigo actual salvo ocho funciones, eximidas
# en `[tool.ruff.lint.per-file-ignores]` como deuda declarada (#832). Un
# umbral mas alto (p.ej. 27, el maximo actual) entraria en verde sin marcar
# nada, pero no protege: una funcion podria crecer hasta ese techo sin que
# el diff lo muestre.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Alembic escribe `op` y `sa` en cada revision desde su template. Las
# revisiones de merge tienen upgrade()/downgrade() vacios, asi que ambos
# quedan sin usar por diseno, no por descuido.
"alembic/versions/*.py" = ["F401"]
# conftest debe poner TEST_DATABASE_URL en el entorno ANTES de importar
# cualquier modulo de `app.*`: settings es un singleton que lee las env vars
# una sola vez, al importarse. Los imports tardios son el mecanismo.
"tests/conftest.py" = ["E402"]
# Complejidad ciclomatica por encima del umbral 12 (issue #832), deuda
# declarada, no una exencion en blanco: el candado function-granular vive en
# `tests/test_lint_contracts.py`, que corre ruff aislado (sin estos ignores)
# y falla si aparece una funcion compleja nueva en estos archivos, o si
# alguna de las de abajo deja de estar en la lista declarada. Esta lista
# solo puede achicarse a medida que se refactoricen.
"app/infraestructura/tareas/alertas_tareas.py" = ["C901"]  # alertar_mora_diaria: 17
"app/servicios_negocio/admin_cuenta_servicio.py" = ["C901"]  # crear_cuenta: 15
"app/servicios_negocio/enrollment_servicio.py" = ["C901"]  # enroll: 26
"app/servicios_negocio/membresia_pago_servicio.py" = ["C901"]  # registrar_pago: 13, corregir_pago: 20, adjuntar_voucher: 16
"scripts/seed_dev_base.py" = ["C901"]  # main: 28
"scripts/seed_dev_bulk.py" = ["C901"]  # main: 27
"tests/test_bloqueo_del_event_loop.py" = ["C901"]  # destino: 15

[tool.importlinter]
# Candado de arquitectura (issue #832): sin esto, nada impedia que la
# direccion de los imports entre capas se acumulara sin aviso. CI corre
# `lint-imports` (Makefile y ci.yml) despues de `ruff check`.
root_package = "app"

[[tool.importlinter.contracts]]
name = "La capa de aplicacion no depende de la web"
type = "forbidden"
source_modules = ["app.servicios_negocio"]
forbidden_modules = ["app.presentacion"]
# Sin excepciones (#829): los DTOs que antes vivian en app.presentacion.schemas
# se mudaron a app.servicios_negocio.dtos, asi que hoy la capa esta limpia y
# el candado lo mantiene asi.

[[tool.importlinter.contracts]]
name = "La infraestructura no depende de la logica de negocio"
type = "forbidden"
source_modules = ["app.infraestructura"]
forbidden_modules = ["app.servicios_negocio"]
# Deuda conocida: `alertas_tareas.py` importa dos nombres con guion bajo de
# servicios_negocio (`acortar_nombre_para_notificacion`, `_meses_enteros_desde`).
# Un nombre privado consumido desde otro modulo no es privado: es API publica
# sin contrato. Esta lista tambien es un piso, no una meta.
ignore_imports = [
    "app.infraestructura.tareas.alertas_tareas -> app.servicios_negocio.notificacion_servicio",
    "app.infraestructura.tareas.alertas_tareas -> app.servicios_negocio.membresia_pago_servicio",
]

[[tool.importlinter.contracts]]
name = "El dominio no depende de ninguna otra capa"
type = "forbidden"
source_modules = ["app.dominio"]
forbidden_modules = ["app.presentacion", "app.servicios_negocio", "app.infraestructura"]
# Sin excepciones: hoy el dominio esta limpio y el candado lo mantiene asi.
