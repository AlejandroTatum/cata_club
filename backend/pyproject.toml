[project]
name = "product-admin-backend"
version = "1.3.0"
description = "API Cata Club - Sistema Integral de Administración (UNL - Diseño de Software)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",  # passlib 1.7.4 no soporta la API de bcrypt>=4.1 (rompe el hashing en runtime)
    "python-multipart>=0.0.12",
    # --- Automatizaciones (Celery + Redis + Beat) ---
    "celery>=5.4.0",
    "redis>=5.1.0",
    # --- Generación de PDFs en memoria ---
    "reportlab>=4.2.0",
    # --- Almacenamiento de archivos en la nube ---
    "cloudinary>=1.41.0",
    # --- Rate limiting ---
    "slowapi>=0.1.9",
    # --- Chatbot de FAQ (DeepSeek vía gateway OpenAI-compatible OpenCode Zen) ---
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    # Linter. Vive en el lock, no en el PATH del desarrollador: CI corre
    # `uv sync --frozen`, así que un ruff global no estaría disponible ahí.
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Set por defecto de ruff: E4 (imports, incluye E402), E7, E9 y F (pyflakes).
# Se deja explicito para que ampliarlo sea una decision visible en el diff.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Alembic escribe `op` y `sa` en cada revision desde su template. Las
# revisiones de merge tienen upgrade()/downgrade() vacios, asi que ambos
# quedan sin usar por diseno, no por descuido.
"alembic/versions/*.py" = ["F401"]
# conftest debe poner TEST_DATABASE_URL en el entorno ANTES de importar
# cualquier modulo de `app.*`: settings es un singleton que lee las env vars
# una sola vez, al importarse. Los imports tardios son el mecanismo.
"tests/conftest.py" = ["E402"]
