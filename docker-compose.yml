services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-cataclub_db}
    volumes:
      - cataclub_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usuario} -d ${POSTGRES_DB:-cataclub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Postgres efímero exclusivo para la suite de tests del backend (perfil
  # "test": no se levanta con `docker compose up` normal, hay que pedirlo
  # explícito con `--profile test up -d db-test`). Deliberadamente separado
  # del `db` de desarrollo — un bug de rollback en los tests jamás debe
  # poder tocar datos reales (ver decisión de diseño 1.1,
  # sdd/production-readiness). `tmpfs` + fsync/synchronous_commit/
  # full_page_writes desactivados: la durabilidad no importa para datos que
  # se destruyen al bajar el contenedor, y esto acelera notablemente la
  # migración de esquema + las ~780 pruebas que corren sobre esta BD.
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: cataclub_test
    # El puerto 5436 lo publica `docker-compose.override.yml`, no este
    # archivo: los puertos publicados viven SOLO en el overlay de desarrollo
    # (decisión de diseño 4.1). `docker compose --profile test up -d db-test`
    # carga el override automáticamente, así que la suite del backend sigue
    # llegando a localhost:5436 sin cambios.
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usuario} -d cataclub_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Imagen publicada en GHCR por el CI de ESTE repositorio, bajo el
    # namespace de su dueño actual, con el tag `IMAGE_TAG` (ver decisión de
    # diseño 4.2, sdd/production-readiness). `docker-compose.override.yml`
    # agrega `build:` para desarrollo local: cuando ambas claves están
    # presentes, Compose construye y etiqueta el resultado con este nombre
    # -- el flujo local no cambia.
    image: ghcr.io/alejandrotatum/cata_club-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-usuario}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-cataclub_db}
      REDIS_URL: redis://redis:6379/0
      # JWT_SECRET_KEY: MUST be set in .env — the backend refuses to start
      # if it detects a placeholder or missing secret (fail-fast validator).
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Error: define JWT_SECRET_KEY in .env (run: openssl rand -hex 32)}"
      JWT_ALGORITMO: HS256
      JWT_EXPIRA_MINUTOS: 60
      JWT_REFRESH_EXPIRA_DIAS: 7
      # Interpolado (no literal): sin esto ningún validador de `Settings`
      # puede ver lo que el operador exporta -- ver
      # tests/test_docker_compose_config.py:
      # test_las_variables_criticas_llegan_al_contenedor_en_el_render_de_produccion.
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_CARPETA_COMPROBANTES: cataclub/comprobantes
      CLOUDINARY_CARPETA_VOUCHERS: cataclub/vouchers
      CLOUDINARY_CARPETA_FOTOS_PERFIL: cataclub/fotos_perfil
      CELERY_HORA_AUTOMATIZACIONES: "02:30"
      AMBIENTE: ${AMBIENTE:-production}
      # Nivel del logger raíz del backend (ver configuracion_logging.py).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- Correo / SMTP -----------------------------------------------------
      # En desarrollo con Docker se usa el contenedor mailpit (SMTP sin auth).
      # En producción sobrescribí estas variables con tu proveedor SMTP real.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@cataclub.com}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # --- Chatbot de FAQ (gateway OpenCode) ---
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      # Gateway y modelo son configuración, no código (issue #766): un modelo
      # del tier gratuito se retira sin aviso y hasta ahora cambiarlo exigía
      # desplegar una imagen nueva. Los defaults son los valores que ya
      # corrían, así que un despliegue existente no cambia de comportamiento.
      # `CHATBOT_MODELOS_RESPALDO` es un CSV de ids a intentar EN ORDEN, y solo
      # cuando el anterior devuelve 404 model_not_found.
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/v1}
      CHATBOT_MODELO: ${CHATBOT_MODELO:-mimo-v2.5-free}
      CHATBOT_MODELOS_RESPALDO: ${CHATBOT_MODELOS_RESPALDO:-deepseek-v4-flash-free}
    healthcheck:
      # PR-09 (sdd/production-readiness): antes apuntaba a /docs. En
      # producción /docs se deshabilita (PR-10), así que el healthcheck no
      # puede depender de esa ruta -- /health no tiene dependencias (ni BD
      # ni auth) y existe justo para esto.
      #
      # `127.0.0.1`, NUNCA `localhost`: dentro del contenedor `localhost`
      # resuelve también a `::1`, y un servidor que bindea una sola familia
      # de direcciones deja la sonda contra `Connection refused`. Hoy esta
      # sonda pasa porque `urllib` recorre todas las direcciones resueltas
      # hasta conectar, pero eso depende del cliente, no del servidor -- el
      # mismo `localhost` con el `wget` de BusyBox tumbó el healthcheck del
      # ingress. Fijar la IPv4 saca al cliente de la ecuación.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # entrypoint.sh: fail-fast si `alembic upgrade head` falla (ver
    # backend/scripts/RUNBOOK_reset_db.md). El `;` que encadenaba esto
    # inline aquí antes NO propagaba el fallo de la migración.
    command: sh scripts/entrypoint.sh

  celery-worker:
    image: ghcr.io/alejandrotatum/cata_club-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    # --concurrency fijo (decisión de diseño 4.6, sdd/production-readiness):
    # sin esto, el modo prefork por defecto de Celery genera un proceso
    # hijo POR CORE DEL HOST -- 745MB medidos en un host de desarrollo de
    # 12 cores, un valor que un droplet de 2GB no puede sostener. En 1 (no
    # 2): cada hijo prefork carga la aplicación entera, y ese proceso de
    # más es justo lo que este droplet no tiene margen para pagar -- el
    # costo funcional es que la tarea nocturna de vencimientos (02:30)
    # procesa las membresías de a una en vez de a dos en paralelo.
    # --max-tasks-per-child recicla los hijos periódicamente, la defensa
    # más barata disponible contra fugas de memoria lentas.
    command: uv run celery -A app.infraestructura.tareas.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=100
    healthcheck:
      # `inspect ping` SIN `-d` interroga a todos los workers del broker y
      # responde OK si contesta cualquiera -- inútil como healthcheck de ESTE
      # contenedor. Con `-d celery@$HOSTNAME` (Docker inyecta el ID del
      # contenedor en HOSTNAME, y ese es el nodename por defecto de Celery)
      # la sonda falla exactamente cuando este worker deja de responder.
      # `uv run` porque la imagen ejecuta todo dentro del venv gestionado por
      # uv, igual que el `command:` de arriba.
      test: ["CMD-SHELL", "uv run celery -A app.infraestructura.tareas.celery_app inspect ping -d celery@$$HOSTNAME -t 10 > /dev/null"]
      interval: 30s
      timeout: 20s
      # start_period generoso: el worker tiene que arrancar el runtime de uv,
      # importar la app y conectar con Redis antes de poder contestar el ping.
      start_period: 90s
      retries: 5

  celery-beat:
    image: ghcr.io/alejandrotatum/cata_club-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    # Dos banderas que existen SOLO para que el healthcheck de abajo sea una
    # sonda de "beat sigue tickeando" y no un simple "el proceso existe":
    #
    #   --schedule: por defecto el PersistentScheduler escribe
    #     `celerybeat-schedule` en el CWD (/app) y el nombre real del archivo
    #     depende del backend de `dbm` de la imagen (en python:3.13-slim sin
    #     gdbm resuelve a `dbm.sqlite3` y aparecen además `-wal`/`-shm`).
    #     Fijar la ruta hace la sonda determinista, y /tmp es escribible por
    #     `appuser` sin depender de los permisos de /app.
    #   --max-interval: el bucle de beat solo sincroniza el schedule DESPUÉS
    #     de despertar (celery/beat.py: `tick()` -> `sleep(interval)` ->
    #     `should_sync()`). Con el schedule diario de esta app el intervalo
    #     es el máximo (300s por defecto), así que el mtime se refrescaría
    #     cada ~300s y quedaría demasiado cerca de la ventana de la sonda.
    #     Con 60s, el sync cae en el primer despertar pasados los 180s de
    #     `sync_every`: refresco garantizado cada <=240s. El costo es un tick
    #     por minuto, que no dispara ninguna tarea.
    command: uv run celery -A app.infraestructura.tareas.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule --max-interval 60
    healthcheck:
      # beat NO es un worker: no responde a `inspect ping`. Y comprobar que
      # el proceso existe no prueba nada -- un beat colgado sigue vivo, y esa
      # es exactamente la falla que importa. Lo que sí se observa desde fuera
      # es que el PersistentScheduler reescribe su base de datos de schedule
      # en cada sync, así que la sonda exige que el archivo exista Y que su
      # mtime sea reciente: si beat deja de tickear, el mtime se congela y la
      # sonda pasa a unhealthy. Ventana de 420s = 240s de refresco garantizado
      # (ver `--max-interval` arriba) + margen para no marcar unhealthy por un
      # sync que se retrasa. Glob porque `dbm` materializa el store en varios
      # archivos según el backend disponible.
      test: ["CMD", "python", "-c", "import glob,os,sys,time; f=glob.glob('/tmp/celerybeat-schedule*'); sys.exit(1) if not f else sys.exit(0 if time.time()-max(map(os.path.getmtime,f)) < 420 else 1)"]
      interval: 30s
      timeout: 10s
      # beat escribe el schedule al arrancar, tras conectar con el broker.
      start_period: 90s
      retries: 3

  frontend:
    restart: unless-stopped
    # Igual que `backend`: la publica el CI de este repositorio en GHCR, bajo
    # el namespace de su dueño actual.
    # `docker-compose.override.yml` agrega `build:` para desarrollo local.
    image: ghcr.io/alejandrotatum/cata_club-frontend:${IMAGE_TAG:-latest}
    environment:
      # Server-only — the Next.js BFF (src/app/api/auth/**) calls FastAPI directly
      # over the compose network, not through localhost.
      BACKEND_API_URL: http://backend:8000/api/v1
    healthcheck:
      # `node -e` y no curl/wget: la imagen final es `node:20-alpine` sin
      # curl, y el wget de BusyBox no distingue bien los códigos de estado.
      # Node ya está ahí (es el runtime del servidor), así que la sonda no
      # agrega superficie a la imagen. Sale != 0 si el status no es 200 o si
      # la conexión falla, igual que el idioma del healthcheck del backend.
      # /api/health es deliberadamente sin dependencias: mide este proceso,
      # no el backend.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      # 15s, no los 60s del backend: el servidor standalone de Next ya viene
      # compilado en la imagen -- solo arranca `node server.js` y escucha; no
      # migra base de datos ni espera a nadie.
      start_period: 15s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cataclub_db_data:
